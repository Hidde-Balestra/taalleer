<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Vol-vlaks vierkant (geen afgeronde hoeken): het OS past zelf een
       masker toe (cirkel, squircle, ...), zie W3C maskable icons. -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- Zelfde motief als logo.svg, verkleind en gecentreerd binnen de
       veilige zone (~80% middencirkel) zodat het masker niets belangrijks
       afsnijdt. -->
  <g transform="translate(256,256) scale(0.62) translate(-277,-271)">
    <rect x="272" y="118" width="172" height="128" rx="34" fill="#F97316"/>
    <polygon points="404,244 440,244 450,282" fill="#F97316"/>

    <rect x="104" y="206" width="240" height="176" rx="44" fill="#FFFFFF"/>
    <polygon points="146,380 188,380 134,424" fill="#FFFFFF"/>
  </g>
</svg>
